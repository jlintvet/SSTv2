name: Static Layers Retrieval (Bathymetry + Wrecks)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retrieve-static-layers:
    name: Fetch bathymetry and wrecks
    runs-on: ubuntu-latest
    timeout-minutes: 150   # bumped from 120: s_fl's BlueTopo fetch+mosaic alone took ~20min in the raster-tile pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          # libgdal-dev is required alongside gdal-bin: gdal-bin only ships
          # the CLI tools (gdal_translate, gdalwarp) -- gdal-config (needed
          # below to pin the matching Python bindings version for s_fl's
          # BlueTopo contour fetch) lives in libgdal-dev.
          sudo apt-get install -y gdal-bin libgdal-dev
          gdal_translate --version
          gdal-config --version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # s_fl only: GDAL Python bindings + NOAA's official BlueTopo
          # fetch/mosaic tool, for _fetch_bathymetry_bluetopo() in
          # StaticLayersRetrieval.py. Lazy-imported there, so this only
          # matters for the s_fl run below -- installed unconditionally
          # here since it's cheap and this step runs once for all 5 regions.
          python -m pip install "GDAL==$(gdal-config --version)"
          python -m pip install noaabathymetry

      - name: Clear bathymetry cache (force CRM re-fetch on bathy-crm branch)
        run: rm -f DailySST/bathymetry*.json DailySST/bathymetry_contours*.json DailySST/bathymetry_grid*.json

      - name: Run StaticLayersRetrieval.py (mid_atlantic)
        run: python StaticLayersRetrieval.py

      - name: Run StaticLayersRetrieval.py (ga_sc)
        run: REGION=ga_sc python StaticLayersRetrieval.py

      - name: Run StaticLayersRetrieval.py (ne_fl)
        run: REGION=ne_fl python StaticLayersRetrieval.py

      - name: Run StaticLayersRetrieval.py (va_ri)
        run: REGION=va_ri python StaticLayersRetrieval.py

      - name: Run StaticLayersRetrieval.py (s_fl)
        run: REGION=s_fl python StaticLayersRetrieval.py

      - name: Commit static layers to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add DailySST/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update static layers (bathymetry + wrecks)"
            # This job runs for 5 regions and can take a long time (CRM fetch +
            # GDAL tiling), so by the time it commits, other automated workflows
            # (SST fetch, VIIRS bundler, buoys) have very likely pushed to main
            # in the meantime -- a plain `git push` was failing here with a
            # non-fast-forward rejection. Same retry pattern already used in
            # Daily SST.yml / VIIRSHourlyBundler.yml.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin HEAD && git push origin HEAD && break
              echo "push attempt $i failed, retrying in 5s..."; sleep 5
            done
          fi
