name: Bake Ocean Mask

on:
  workflow_dispatch:
  push:
    paths:
      - "bake_ocean_mask.py"
      - "bake_ocean_mask_ga_sc.py"
      - "bake_ocean_mask_ne_fl.py"

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --upgrade pip requests

      - name: Bake mid-Atlantic mask
        run: python bake_ocean_mask.py

      - name: Bake GA/SC mask
        run: python bake_ocean_mask_ga_sc.py

      - name: Bake NE Florida mask
        run: python bake_ocean_mask_ne_fl.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add DailySSTData/ocean_mask.json DailySSTData/ga_sc/ocean_mask.json DailySSTData/ne_fl/ocean_mask.json
          git commit -m "Update ocean masks (mid-Atlantic + GA/SC + NE Florida)" || echo "No changes"

          # This job takes several minutes (downloads + classifies Natural Earth
          # polygons for 3 regions), and this repo has other automated workflows
          # (VIIRS bundler, hotspots, buoys, SST fetch) committing to main every
          # few minutes. A plain `git push` here was silently losing that race
          # every time (non-fast-forward rejection), which is why no ocean-mask
          # commit had ever landed. Retry with a rebase against origin/main.
          for i in 1 2 3 4 5 6; do
            if git push; then
              echo "Pushed on attempt $i"
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "Push still failing after 6 attempts, giving up"
              exit 1
            fi
            echo "Push rejected (attempt $i) — fetching + rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((5 * i))
          done
