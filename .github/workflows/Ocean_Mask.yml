name: Bake Ocean Mask

on:
  workflow_dispatch:
  push:
    paths:
      - "bake_ocean_mask.py"
      - "bake_ocean_mask_ga_sc.py"

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --upgrade pip requests

      - name: Bake mid-Atlantic mask
        run: python bake_ocean_mask.py

      - name: Bake GA/SC mask
        run: python bake_ocean_mask_ga_sc.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add DailySSTData/ocean_mask.json DailySSTData/ga_sc/ocean_mask.json
          git commit -m "Update ocean masks (mid-Atlantic + GA/SC)" || echo "No changes"
          git push
