name: Weather Buoys Fetch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  fetch-buoys:
    name: Fetch NDBC Buoys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install requests
      - name: Fetch buoy observations
        run: python -u fetch_buoys.py 2>&1 | tee buoys_fetch.log
      - name: Commit buoy data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DailySST/Buoys/buoys_latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # commit BEFORE rebasing (rebase refuses with a dirty index); retry for concurrency
            git commit -m "buoys: NDBC update $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin HEAD && git push origin HEAD && break
              echo "push attempt $i failed, retrying in 5s..."; sleep 5
            done
          fi
      - name: Trigger hourly workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Buoys run every 15 min (:00, :15, :30, :45). Fire hourly workflows on
          # whichever run lands first in each hour (minute 0-14). The 25-min SST
          # fetch finishes well before the next hour's trigger.
          MINUTE=$(date -u +%M | sed 's/^0*//')
          MINUTE=${MINUTE:-0}
          if [ "$MINUTE" -le 14 ]; then
            echo "Minute=$MINUTE — triggering hourly workflows..."
            gh workflow run "Daily SST.yml"          --repo jlintvet/SSTv2 --ref main || true
            gh workflow run "Update wind data.yml"   --repo jlintvet/SSTv2 --ref main || true
            gh workflow run "VIIRSHourlyBundler.yml" --repo jlintvet/SSTv2 --ref main || true
          else
            echo "Minute=$MINUTE — not in trigger window, skipping."
          fi
