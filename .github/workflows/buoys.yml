name: Weather Buoys Fetch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch-buoys:
    name: Fetch NDBC Buoys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install requests
      - name: Fetch buoy observations
        run: python -u fetch_buoys.py 2>&1 | tee buoys_fetch.log
      - name: Commit buoy data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DailySST/Buoys/buoys_latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # commit BEFORE rebasing (rebase refuses with a dirty index); retry for concurrency
            git commit -m "buoys: NDBC update $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin HEAD && git push origin HEAD && break
              echo "push attempt $i failed, retrying in 5s..."; sleep 5
            done
          fi
