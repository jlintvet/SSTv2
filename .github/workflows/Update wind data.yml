# .github/workflows/update_wind_data.yml
#
# Runs Getwinddata.py every hour at :15 past.
#
# The script fetches wind forecasts from Open-Meteo and writes
# WindData/wind_latest.json as a plain local file. The workflow itself
# commits and pushes it (git config + add + commit + fetch/rebase/retry
# loop), the same pattern used by Ocean_Mask.yml and fetch-ocean-dynamics.yml
# for their own auto-committed output.
#
# Changed 2026-07-12: this used to have the Python script push directly via
# the GitHub REST API (first the Contents API, then the Git Data API after
# the Contents API started rejecting the file as too large). Once the va_ri
# grid widening (61x41 -> 69x59 points) grew the payload past ~40MB, BOTH
# REST paths failed with a 422 -- they each wrap the whole file as a single
# inline JSON request body, which apparently has a much lower practical
# ceiling than git's own object size limits. Switching to a plain git
# commit/push (git's native smart-HTTP protocol, no JSON-body wrapping)
# sidesteps this entirely, consistent with how every other large/frequent
# data-writing workflow in this repo already works.

name: Update Wind Data

on:
  schedule:
    - cron: '15 * * * *'    # every hour at :15 past
  workflow_dispatch:          # also adds a "Run workflow" button in the Actions tab for manual runs

permissions:
  contents: write

jobs:
  update-wind:
    runs-on: ubuntu-latest
    timeout-minutes: 35       # kill the job if Open-Meteo hangs (raised from 10 to 20 for ne_fl's 45x41->61x41 grid widening; raised again to 35 — va_ri widened the grid from 61x41 to 69x59 points (LAT_MAX 40->42, LON_MAX -72.5->-68.0) to reach Rhode Island, roughly 1.6x more Open-Meteo batches)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run wind data update
        run: python Getwinddata.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add WindData/wind_latest.json
          git commit -m "wind data update $(date -u +%Y-%m-%dT%H:%M)Z" || echo "No changes"

          # This repo has several other automated workflows (VIIRS bundler,
          # hotspots, buoys, SST fetch, ocean dynamics) committing to main
          # every few minutes -- a plain `git push` can lose that race with
          # a non-fast-forward rejection. Retry with a rebase against
          # origin/main, same pattern as Ocean_Mask.yml.
          for i in 1 2 3 4 5 6; do
            if git push; then
              echo "Pushed on attempt $i"
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "Push still failing after 6 attempts, giving up"
              exit 1
            fi
            echo "Push rejected (attempt $i) — fetching + rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((5 * i))
          done
