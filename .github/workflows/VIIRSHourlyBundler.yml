name: VIIRS Hourly Bundler
on:
  schedule:
    - cron: '0 * * * *'   # every hour at :00
  workflow_dispatch:        # manual trigger from GitHub UI
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy xarray netcdf4
      - run: python VIIRSHourlyBundler.py
        env:
          DAYS_BACK: 3
      - name: Commit updated bundles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DailySSTData/VIIRS/Bundled/
          git diff --cached --quiet || git commit -m "chore: VIIRS hourly bundle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
